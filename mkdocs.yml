site_name: 📱 Mobile AIOS Wiki
site_description: 手机端 AI 操作系统知识库
site_url: https://yuelich.github.io/aios-wiki/
repo_url: https://github.com/YueLich/aios-wiki

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 亮色模式
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 实体:
    - 实体总览: entities/index.md
    - 🔧 推理框架与工具链:
      - GGML 与 llama.cpp: entities/ggml-llamacpp-hf.md
      - llama.cpp b8791: entities/llamacpp-b8791.md
      - MNN 3.5.0: entities/mnn-350.md
      - coremltools 9.0: entities/coremltools-9.md
      - AnyLanguageModel: entities/anylanguagemodel-apple.md
    - 🧠 模型:
      - Gemma 4: entities/gemma4-ondevice.md
      - Gemini Flash Live: entities/gemini-flash-live.md
      - MiniCPM 2.4.2: entities/minicpm-242.md
    - 📱 设备与平台:
      - iPhone 17e: entities/iphone-17e.md
      - Google AI Edge Gallery: entities/google-ai-edge-gallery.md
      - Google Translate iOS: entities/google-translate-ios-live2.md
      - Android Studio Agent Mode: entities/android-studio-agent-mode.md
      - Zuver Agent 框架: entities/zuver.md
      - Google 个人智能: entities/personal-intelligence-google.md
  - 概念:
    - 概念总览: concepts/index.md
    - 🤖 Agent 系统:
      - ClawMobile: concepts/clawmobile-agentic.md
      - SecAgent: concepts/secagent-mobile-gui.md
      - MGA 记忆驱动 GUI Agent: concepts/mga-memory-gui-agent.md
      - PSPA-Bench: concepts/pspa-bench-gui-agent.md
