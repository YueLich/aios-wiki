site_name: 📱 Mobile AIOS Wiki
site_description: 手机端 AI 操作系统知识库
site_url: https://yuelich.github.io/aios-wiki/
repo_url: https://github.com/YueLich/aios-wiki

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 亮色模式
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 实体: entities/index.md
  - 概念: concepts/index.md
  - 对比: comparisons/index.md
  - 速查: queries/index.md
