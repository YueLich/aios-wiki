name: Deploy Wiki

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Validate mkdocs.yml
        run: python3 -c "import yaml; c = yaml.safe_load(open('mkdocs.yml')); print(f'Nav entries OK: {len(c.get("nav", []))} top-level items')"

      - name: Deploy
        run: mkdocs gh-deploy --force
